name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  # Makes tests/test_package.py fail (instead of letting ML tests skip) if sklearn/torch are absent.
  EXPERIONYX_REQUIRE_FRAMEWORKS: "1"
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false # one Python version failing must not hide the other's result
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # CPU-only torch wheel: the default PyPI wheel pulls multi-GB CUDA libraries.
      - name: Install
        run: |
          pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,sklearn,torch]"
      - name: Tool and framework versions
        run: pip list 2>/dev/null | grep -Ei "^(pytest|ruff|mypy|numpy|scikit-learn|torch|joblib|scipy) "
      # Each check runs even if an earlier one failed, so a single run reports every problem.
      - name: Ruff (lint)
        if: ${{ !cancelled() }}
        run: ruff check .
      - name: Ruff (format)
        if: ${{ !cancelled() }}
        run: ruff format --check .
      - name: Mypy (strict)
        if: ${{ !cancelled() }}
        run: mypy
      - name: Pytest
        if: ${{ !cancelled() }}
        run: pytest -ra --durations=5
