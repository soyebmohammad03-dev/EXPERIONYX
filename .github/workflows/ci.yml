name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # CPU-only torch wheel: the default PyPI wheel pulls multi-GB CUDA libraries.
      - run: pip install torch --extra-index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev,sklearn,torch]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest
