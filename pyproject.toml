[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "experionyx"
version = "0.0.1"
description = "AI Experimental Forensics & Reliability Laboratory"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.4"]
torch = ["torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
experionyx = "experionyx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/experionyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "T20", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311", "S603", "S607"]  # asserts; subprocess of git in fixtures
"src/experionyx/cli.py" = ["T201"]  # CLI output is intentional stdout
"examples/*" = ["T201", "S311"]  # demo output; random is for illustration, not security

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# torch/numpy typing differs between versions (3.11 vs 3.12 resolve different releases), so
# `type: ignore` comments cannot be "unused" consistently; torch's jit API is untyped.
module = [
    "experionyx.adapters.torch_adapter",
    "experionyx.adapters.sklearn_adapter",
    "experionyx.demos",
    "test_sklearn_adapter",
    "test_torch_adapter",
    "test_adapter_e2e",
]
warn_unused_ignores = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# Framework-heavy tests index/call torch and numpy objects dynamically; src/ stays strict.
module = ["test_sklearn_adapter", "test_torch_adapter", "test_adapter_e2e"]
disable_error_code = ["index", "operator", "call-overload", "arg-type", "attr-defined", "union-attr"]

[[tool.mypy.overrides]]
# scikit-learn and joblib ship no type information.
module = ["sklearn", "sklearn.*", "joblib"]
ignore_missing_imports = true
