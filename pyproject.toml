[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "experionyx"
version = "0.0.1"
description = "AI Experimental Forensics & Reliability Laboratory"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
sklearn = ["scikit-learn>=1.4"]
torch = ["torch>=2.2"]
# The fault library needs numpy (also pulled in by sklearn); the core stays dependency-free.
faults = ["numpy>=1.26"]
# Upper bounds keep a new major release of a tool from silently breaking CI.
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "mypy>=1.11,<3"]

[project.scripts]
experionyx = "experionyx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/experionyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "T20", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S311", "S603", "S607"]  # asserts; subprocess of git in fixtures
"tests/test_eval*.py" = ["E501"]  # dense numeric expectations
"tests/test_fault*.py" = ["E501"]  # dense experiment tables
"tests/test_evaluation_engine.py" = ["E501"]
"tests/test_stats*.py" = ["E501", "PT018"]  # dense closed-form ground-truth assertions
"src/experionyx/stats/*.py" = ["E501"]  # docstring tables and dense typed constructions
"src/experionyx/slices/*.py" = ["E501"]  # dense typed result documents
"tests/test_slice*.py" = ["E501", "PT018"]  # dense expected values
"src/experionyx/drift/*.py" = ["E501"]  # dense typed result documents and messages
"tests/test_drift*.py" = ["E501", "PT018", "C408"]
"tests/test_migration.py" = ["PT018"]  # compound schema-version assertions  # dense expected values
"tests/drift_helpers.py" = ["E501"]
"src/experionyx/data_quality/*.py" = ["E501", "S105"]  # status names are not passwords;  # dense typed result documents and messages
"tests/test_quality*.py" = ["E501", "PT018", "C408"]  # dense expected values
"tests/quality_helpers.py" = ["E501"]
"src/experionyx/stress/*.py" = ["E501"]  # dense typed constructions and messages
"tests/test_stress*.py" = ["E501", "PT018", "C408"]  # dense expected values
"tests/stress_helpers.py" = ["E501"]
"src/experionyx/calibration/*.py" = ["E501"]  # dense typed result documents and messages
"tests/test_calibration*.py" = ["E501", "PT018", "C408"]  # dense expected values
"tests/calibration_helpers.py" = ["E501"]
"src/experionyx/resources/*.py" = ["E501"]  # dense typed result documents and messages
"tests/test_resource*.py" = ["E501", "PT018", "C408"]  # dense expected values
"tests/resource_helpers.py" = ["E501"]
"tests/test_cross_phase.py" = ["E501", "PT018"]  # dense expected values
"tests/eval_helpers.py" = ["E501"]
"src/experionyx/cli.py" = ["T201", "E501"]  # CLI output is intentional stdout; dense JSON/print tables
"src/experionyx/evaluation/metrics.py" = ["E501"]  # the built-in metric table is one line per metric
"src/experionyx/faults/demos.py" = ["E501"]  # experiment tables
"src/experionyx/faults/lab.py" = ["E501"]  # dense orchestration calls
"src/experionyx/faults/engine.py" = ["E501"]  # dense artifact/claim construction
"src/experionyx/faults/analysis.py" = ["E501"]  # dense typed constructions
"src/experionyx/faults/design.py" = ["E501"]  # explicit limit messages
"src/experionyx/faults/entities.py" = ["E501"]  # field-name tuples
"src/experionyx/faults/degradation.py" = ["E501"]  # dense typed constructions and messages
"src/experionyx/faults/library.py" = ["E501"]  # the built-in fault table is one line per fault
"src/experionyx/evaluation/engine.py" = ["E501"]  # dense keyword-argument constructions
"src/experionyx/evaluation/findings.py" = ["E501"]  # rule table and deterministic message templates
"src/experionyx/failures/*.py" = ["E501"]  # dense transition/criteria tables
"src/experionyx/benchmark/*.py" = ["E501"]  # dense typed constructions
"tests/test_benchmark*.py" = ["E501", "PT018", "C408"]
"tests/benchmark_helpers.py" = ["E501"]
"src/experionyx/reliability/*.py" = ["E501"]  # dense typed constructions
"tests/test_reliability*.py" = ["E501", "PT018", "C408"]
"tests/reliability_helpers.py" = ["E501"]
"src/experionyx/interactions/*.py" = ["E501"]  # dense typed constructions and messages
"tests/test_interaction*.py" = ["E501", "PT018", "C408"]
"tests/interaction_helpers.py" = ["E501"]
"tests/test_failure*.py" = ["E501", "PT018"]  # dense expectation tables; compound asserts read fine
"tests/failure_helpers.py" = ["E501"]
"src/experionyx/scheduler/*.py" = ["E501"]  # dense dispatch/orchestration constructions
"tests/test_scheduler*.py" = ["E501", "PT018", "C408"]  # dense expected values
"tests/scheduler_helpers.py" = ["E501"]
"src/experionyx/graph/*.py" = ["E501"]  # dense entity/taxonomy tables and constructions
"tests/test_graph*.py" = ["E501", "PT018", "C408"]  # dense expected values
"tests/graph_helpers.py" = ["E501"]
"src/experionyx/reproducibility/*.py" = ["E501"]  # dense entity/taxonomy tables and constructions
"tests/test_reproducibility*.py" = ["E501", "PT018", "C408"]  # dense expected values
"tests/reproducibility_helpers.py" = ["E501"]
"src/experionyx/leaderboard/*.py" = ["E501"]  # dense entity/taxonomy tables and constructions
"tests/test_leaderboard*.py" = ["E501", "PT018", "C408"]  # dense expected values
"tests/leaderboard_helpers.py" = ["E501"]
"src/experionyx/reporting/*.py" = ["E501"]  # dense entity/taxonomy tables and constructions
"tests/test_reporting*.py" = ["E501", "PT018", "C408"]  # dense expected values
"src/experionyx/dossier/*.py" = ["E501"]  # dense entity/taxonomy tables and constructions
"tests/test_dossier*.py" = ["E501", "PT018", "C408"]  # dense expected values
"examples/*" = ["T201", "S311"]  # demo output; random is for illustration, not security

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# torch/numpy typing differs between versions (3.11 vs 3.12 resolve different releases), so
# `type: ignore` comments cannot be "unused" consistently; torch's jit API is untyped.
module = [
    "experionyx.faults.library",
    "experionyx.faults.apply",
    "experionyx.faults.demos",
    "experionyx.adapters.torch_adapter",
    "experionyx.adapters.sklearn_adapter",
    "experionyx.demos",
    "test_sklearn_adapter",
    "test_torch_adapter",
    "test_adapter_e2e",
    "test_evaluation_frameworks",
    "test_eval_metrics",
    "test_fault_spec",
    "test_fault_degradation",
    "test_fault_library",
    "test_fault_lab",
    "test_fault_frameworks",
    "test_failure_model",
    "test_failure_discovery",
    "test_failure_cli",
    "failure_helpers",
    "test_interaction_model",
    "test_interaction_e2e",
    "test_interaction_cli",
    "interaction_helpers",
    "test_reliability_model",
    "test_reliability_e2e",
    "test_reliability_cli",
    "reliability_helpers",
    "test_benchmark_model",
    "test_benchmark_e2e",
    "test_benchmark_cli",
    "benchmark_helpers",
]
warn_unused_ignores = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# numpy-heavy array code: the generic-dtype stubs cannot express these operations precisely.
module = ["experionyx.faults.library", "experionyx.faults.apply", "experionyx.faults.demos"]
disable_error_code = ["operator", "call-overload", "arg-type", "assignment", "index", "attr-defined", "no-any-return", "misc"]

[[tool.mypy.overrides]]
# Framework-heavy tests index/call torch and numpy objects dynamically; src/ stays strict.
module = ["test_sklearn_adapter", "test_torch_adapter", "test_adapter_e2e", "test_evaluation_engine", "test_eval_analysis", "test_evaluation_frameworks", "test_eval_metrics", "test_fault_spec", "test_fault_library", "test_fault_degradation", "test_fault_lab", "test_fault_frameworks", "test_failure_model", "test_failure_discovery", "test_failure_cli", "failure_helpers", "test_interaction_model", "test_interaction_e2e", "test_interaction_cli", "interaction_helpers", "test_reliability_model", "test_reliability_e2e", "test_reliability_cli", "reliability_helpers", "test_benchmark_model", "test_benchmark_e2e", "test_benchmark_cli", "benchmark_helpers"]
warn_unused_ignores = false
disable_error_code = ["index", "operator", "call-overload", "arg-type", "attr-defined", "union-attr"]

[[tool.mypy.overrides]]
# scikit-learn and joblib ship no type information.
module = ["sklearn", "sklearn.*", "joblib"]
ignore_missing_imports = true
