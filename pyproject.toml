[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "experionyx"
version = "0.0.1"
description = "AI Experimental Forensics & Reliability Laboratory"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
experionyx = "experionyx.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/experionyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "T20", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"src/experionyx/cli.py" = ["T201"]  # CLI output is intentional stdout

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]
